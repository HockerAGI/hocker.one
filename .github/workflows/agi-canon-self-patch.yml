name: AGI Canon Conservative Gateway Patch

on:
  push:
    branches:
      - fix/agi-canon-runtime-completion-20260803
    paths:
      - .github/workflows/agi-canon-self-patch.yml

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agi-canon-runtime-completion-20260803
          fetch-depth: 0

      - name: Patch truthful AI Gateway state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/agi-runtime-core.ts')
          s = p.read_text()

          old = '''  } else if (hasCredentials) {
              status = "connected";
              statusLabel = "Conectado";
              statusHint = "Credenciales mínimas detectadas y executor disponible para validación controlada.";
          '''
          new = '''  } else if (tool.tool_key === "ai_gateway" && hasCredentials) {
              status = "partial";
              statusLabel = "Parcial";
              statusHint = "Credencial detectada. Falta una inferencia real verificada antes de marcar AI Gateway como conectado.";
            } else if (hasCredentials) {
              status = "connected";
              statusLabel = "Conectado";
              statusHint = "Credenciales mínimas detectadas y executor disponible para validación controlada.";
          '''
          if old not in s and 'tool.tool_key === "ai_gateway" && hasCredentials' not in s:
              raise SystemExit('status anchor not found')
          s = s.replace(old, new)

          old = '''    execution_enabled:
              hasCredentials && tool.implementation_status === "executor_ready",
          '''
          new = '''    execution_enabled:
              hasCredentials &&
              tool.implementation_status === "executor_ready" &&
              tool.tool_key !== "ai_gateway",
          '''
          if old not in s and 'tool.tool_key !== "ai_gateway"' not in s:
              raise SystemExit('execution anchor not found')
          s = s.replace(old, new)

          old = '''    const now = new Date().toISOString();
              const tools = getRuntimeToolCatalog();
              const agents = canonicalAgentRows(project_id, now);
          '''
          new = '''    const now = new Date().toISOString();
              const tools = getRuntimeToolCatalog();
              const { data: gatewayChecks, error: gatewayCheckError } = await sb
                .from("agi_integration_checks")
                .select("status,configured,last_checked_at")
                .eq("project_id", project_id)
                .eq("tool_key", "ai_gateway")
                .order("last_checked_at", { ascending: false })
                .limit(1);
              if (gatewayCheckError) throw gatewayCheckError;

              const gatewayHealthy =
                gatewayChecks?.[0]?.status === "healthy" &&
                gatewayChecks?.[0]?.configured === true;
              const effectiveTools = tools.map((tool) =>
                tool.tool_key === "ai_gateway" && gatewayHealthy
                  ? {
                      ...tool,
                      status: "connected" as const,
                      status_label: "Conectado" as const,
                      status_hint: "Inferencia real verificada y registrada en agi_integration_checks.",
                      execution_enabled: true,
                    }
                  : tool,
              );
              const agents = canonicalAgentRows(project_id, now);
          '''
          if old not in s and 'const gatewayHealthy =' not in s:
              raise SystemExit('sync anchor not found')
          s = s.replace(old, new)
          s = s.replace('const toolRows = tools.map((tool) => ({', 'const toolRows = effectiveTools.map((tool) => ({')
          s = s.replace('const toolByKey = new Map(tools.map((tool) => [tool.tool_key, tool]));', 'const toolByKey = new Map(effectiveTools.map((tool) => [tool.tool_key, tool]));')
          p.write_text(s)
          PY

      - name: Verify patch and tests
        run: |
          grep -q 'const gatewayHealthy =' src/lib/agi-runtime-core.ts
          grep -q 'tool.tool_key !== "ai_gateway"' src/lib/agi-runtime-core.ts
          npm ci
          npm test
          npx tsc --noEmit

      - name: Commit generated patch
        run: |
          if git diff --quiet -- src/lib/agi-runtime-core.ts; then
            exit 0
          fi
          git config user.name "Hocker AGI"
          git config user.email "contacto.hocker@gmail.com"
          git add src/lib/agi-runtime-core.ts
          git commit -m "fix(agi): require verified AI Gateway health"
          git push origin HEAD:fix/agi-canon-runtime-completion-20260803
