name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "out/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tests/android-bootstrap-security.test.mjs"
      - ".github/workflows/android-debug.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "out/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tests/android-bootstrap-security.test.mjs"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and verify Hocker ONE debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate secure Capacitor bootstrap
        shell: bash
        run: |
          test -s out/index.html
          ! grep -Eqi '<script[^>]+src=' out/index.html
          ! grep -Eqi 'http://|myninja\.ai' out/index.html
          grep -Fq 'Content-Security-Policy' out/index.html
          grep -Fq 'https://hockerone.vercel.app' out/index.html

      - name: Run Android bootstrap regression test
        run: node --test tests/android-bootstrap-security.test.mjs

      - name: Sync Capacitor Android shell
        run: npm run android:sync

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Run Android unit tests and lint
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hocker-one-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
