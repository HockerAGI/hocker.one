name: Android Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-release.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "out/**"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-release:
    name: Build and cryptographically verify Hocker ONE Android
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      BUNDLETOOL_VERSION: "1.18.3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Prepare signing identity
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hocker-one-release.jks"

          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            key_kind="configured-release-key"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            password="$(openssl rand -hex 24)"
            alias_name="hocker-one-pr-verification"
            echo "::add-mask::$password"
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -storepass "$password" \
              -keypass "$password" \
              -alias "$alias_name" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 30 \
              -dname "CN=Hocker ONE CI Verification,OU=Temporary Build,O=Hocker AGI Technologies,L=Tijuana,ST=Baja California,C=MX"
            echo "ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$alias_name" >> "$GITHUB_ENV"
            key_kind="ephemeral-pr-verification-key"
          else
            echo "A tag or manual release requires ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD." >&2
            exit 1
          fi

          test -s "$keystore"
          chmod 600 "$keystore"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#android-v}"
          else
            version_name="1.1.${GITHUB_RUN_NUMBER}"
          fi

          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_KIND=$key_kind" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Validate secure Capacitor bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          ! grep -Eqi '<script[^>]+src=' out/index.html
          ! grep -Eqi 'http://|myninja\.ai' out/index.html
          grep -Fq 'Content-Security-Policy' out/index.html
          grep -Fq 'https://hockerone.vercel.app' out/index.html

      - name: Sync Capacitor Android shell
        run: npm run android:sync

      - name: Test, lint and build signed release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest lintRelease assembleRelease bundleRelease --stacktrace

      - name: Verify APK and AAB packaging, signatures and metadata
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apks < <(find android/app/build/outputs/apk/release -type f -name '*.apk' | sort)
          mapfile -t aabs < <(find android/app/build/outputs/bundle/release -type f -name '*.aab' | sort)
          [[ "${#apks[@]}" -eq 1 ]]
          [[ "${#aabs[@]}" -eq 1 ]]

          apk="${apks[0]}"
          aab="${aabs[0]}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$zipalign"
          test -x "$aapt"

          verification="android/app/build/outputs/release-verification"
          mkdir -p "$verification"
          printf '%s\n' "$RELEASE_KEY_KIND" > "$verification/RELEASE-KEY-KIND.txt"
          if [[ "$RELEASE_KEY_KIND" == "ephemeral-pr-verification-key" ]]; then
            cat > "$verification/NOT-FOR-PRODUCTION.txt" <<'EOF'
          This build is cryptographically valid and installable, but it is signed with a temporary CI key.
          It proves package integrity only. It must not be published or used as the permanent Android update identity.
          EOF
          fi

          "$apksigner" verify --verbose --print-certs "$apk" | tee "$verification/APK-SIGNATURE.txt"
          "$zipalign" -c -P 16 -v 4 "$apk" | tee "$verification/APK-ZIPALIGN.txt"
          "$aapt" dump badging "$apk" | tee "$verification/APK-BADGING.txt"

          grep -Fq "package: name='com.hocker.one'" "$verification/APK-BADGING.txt"
          grep -Fq "sdkVersion:'24'" "$verification/APK-BADGING.txt"
          grep -Fq "targetSdkVersion:'35'" "$verification/APK-BADGING.txt"
          grep -Fq "versionName='${ANDROID_VERSION_NAME}'" "$verification/APK-BADGING.txt"

          # Android app signing keys are normally self-signed. `-strict` turns the
          # expected trust-chain warning into exit code 4 even when the bundle is
          # correctly signed, so verify cryptographic integrity without `-strict`.
          jarsigner -verify -verbose -certs "$aab" > "$verification/AAB-JARSIGNER.txt" 2>&1
          grep -Fq 'jar verified.' "$verification/AAB-JARSIGNER.txt"
          unzip -t "$aab" | tee "$verification/AAB-ZIP-TEST.txt"

          bundletool="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$bundletool"
          test -s "$bundletool"

          ks_pass_file="$RUNNER_TEMP/android-keystore.pass"
          key_pass_file="$RUNNER_TEMP/android-key.pass"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$ks_pass_file"
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$key_pass_file"
          chmod 600 "$ks_pass_file" "$key_pass_file"

          generated_apks="$verification/hocker-one-universal.apks"
          java -jar "$bundletool" build-apks \
            --bundle="$aab" \
            --output="$generated_apks" \
            --mode=universal \
            --ks="$ANDROID_KEYSTORE_PATH" \
            --ks-pass="file:$ks_pass_file" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass="file:$key_pass_file" \
            --overwrite

          unzip -p "$generated_apks" universal.apk > "$verification/universal-from-aab.apk"
          test -s "$verification/universal-from-aab.apk"
          "$apksigner" verify --verbose --print-certs "$verification/universal-from-aab.apk" \
            | tee "$verification/AAB-UNIVERSAL-APK-SIGNATURE.txt"
          "$zipalign" -c -P 16 -v 4 "$verification/universal-from-aab.apk" \
            | tee "$verification/AAB-UNIVERSAL-APK-ZIPALIGN.txt"
          "$aapt" dump badging "$verification/universal-from-aab.apk" \
            | tee "$verification/AAB-UNIVERSAL-APK-BADGING.txt"
          grep -Fq "package: name='com.hocker.one'" "$verification/AAB-UNIVERSAL-APK-BADGING.txt"

          sha256sum \
            "$apk" \
            "$aab" \
            "$generated_apks" \
            "$verification/universal-from-aab.apk" \
            > "$verification/SHA256SUMS.txt"
          cat "$verification/SHA256SUMS.txt"

      - name: Upload verified APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: hocker-one-${{ env.RELEASE_KEY_KIND }}-${{ env.ANDROID_VERSION_NAME }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/release-verification/**
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            "${ANDROID_KEYSTORE_PATH:-}" \
            "$RUNNER_TEMP/android-keystore.pass" \
            "$RUNNER_TEMP/android-key.pass"
