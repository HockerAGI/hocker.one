name: Android Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-release:
    name: Build, sign and verify Hocker ONE release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"

      - name: Prepare release identity
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hocker-one-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#android-v}"
          else
            version_name="1.1.${GITHUB_RUN_NUMBER}"
          fi

          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Validate secure Capacitor bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          ! grep -Eqi '<script[^>]+src=' out/index.html
          ! grep -Eqi 'http://|myninja\.ai' out/index.html
          grep -Fq 'Content-Security-Policy' out/index.html
          grep -Fq 'https://hockerone.vercel.app' out/index.html

      - name: Sync Capacitor Android shell
        run: npm run android:sync

      - name: Test, lint and build signed release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest lintRelease assembleRelease bundleRelease --stacktrace

      - name: Verify APK signature and generate hashes
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"

          mkdir -p android/app/build/outputs/release-verification
          checksums="android/app/build/outputs/release-verification/SHA256SUMS.txt"
          : > "$checksums"

          while IFS= read -r -d '' apk; do
            "$apksigner" verify --verbose --print-certs "$apk"
            sha256sum "$apk" >> "$checksums"
          done < <(find android/app/build/outputs/apk/release -type f -name '*.apk' -print0)

          find android/app/build/outputs/bundle/release -type f -name '*.aab' -print0 |
            xargs -0 -r sha256sum >> "$checksums"

          test -s "$checksums"
          cat "$checksums"

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: hocker-one-signed-${{ env.ANDROID_VERSION_NAME }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/release-verification/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "${ANDROID_KEYSTORE_PATH:-}"
