name: Android Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-release.yml"
      - ".github/scripts/android-build-verify.sh"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "out/**"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLETOOL_VERSION: "1.18.3"

jobs:
  verify-pr-package:
    name: Verify installable Android package with temporary key
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Generate temporary verification identity
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hocker-one-pr-verification.jks"
          password="$(openssl rand -hex 24)"
          alias_name="hocker-one-pr-verification"
          echo "::add-mask::$password"

          keytool -genkeypair -v \
            -keystore "$keystore" \
            -storepass "$password" \
            -keypass "$password" \
            -alias "$alias_name" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 30 \
            -dname "CN=Hocker ONE CI Verification,OU=Temporary Build,O=Hocker AGI Technologies,L=Tijuana,ST=Baja California,C=MX"

          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$alias_name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_KIND=ephemeral-pr-verification-key" >> "$GITHUB_ENV"

      - name: Build and verify temporary package
        shell: bash
        run: bash .github/scripts/android-build-verify.sh

      - name: Upload verification-only APK and AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hocker-one-not-for-production-${{ env.ANDROID_VERSION_NAME }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/release-verification/**
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            "${ANDROID_KEYSTORE_PATH:-}" \
            "$RUNNER_TEMP/android-keystore.pass" \
            "$RUNNER_TEMP/android-key.pass"

  build-production-release:
    name: Build production-signed Android release
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout trusted release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Load permanent Android signing identity
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"

          keystore="$RUNNER_TEMP/hocker-one-production-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#android-v}"
          else
            version_name="1.1.${GITHUB_RUN_NUMBER}"
          fi

          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_KIND=configured-release-key" >> "$GITHUB_ENV"

      - name: Build and verify production package
        shell: bash
        run: bash .github/scripts/android-build-verify.sh

      - name: Upload production-signed APK and AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hocker-one-production-${{ env.ANDROID_VERSION_NAME }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/release-verification/**
          if-no-files-found: error
          retention-days: 90

      - name: Remove permanent signing material from runner
        if: always()
        shell: bash
        run: |
          rm -f \
            "${ANDROID_KEYSTORE_PATH:-}" \
            "$RUNNER_TEMP/android-keystore.pass" \
            "$RUNNER_TEMP/android-key.pass"
