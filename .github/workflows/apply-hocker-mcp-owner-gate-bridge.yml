name: Apply Hocker ONE MCP Owner Gate bridge

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/mcp-owner-gate-bridge-20260731' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mcp-owner-gate-bridge-20260731
          fetch-depth: 0

      - name: Connect NOVA drafts to queue and worker
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          chat_path = Path('src/app/api/nova/chat/route.ts')
          chat = chat_path.read_text()
          import_anchor = 'import { materializeNovaGitHubActionsFromChat } from "@/lib/nova-github-action-materializer";'
          import_line = 'import { materializeNovaMcpActionsFromUpstream } from "@/lib/nova-mcp-action-materializer";'
          if import_line not in chat:
            if import_anchor not in chat:
              raise SystemExit('chat import anchor missing')
            chat = chat.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          if 'materializeNovaMcpActionsFromUpstream({' not in chat:
            pattern = re.compile(
              r'(\s*const responseJson = \(await res\.json\(\)\.catch\(\(\) => \(\{\}\)\)\) as NovaChatResponse;)\s*\n\s*const safePayload = sanitizeNovaPayload\(responseJson, injectedMeta, localActionDraft\);',
            )
            replacement = r'''\1
    let mcpBridge: Awaited<ReturnType<typeof materializeNovaMcpActionsFromUpstream>> = {
      actions: [],
      rejected: [],
    };
    const upstreamMcp =
      responseJson.meta && typeof responseJson.meta.mcp === "object" && responseJson.meta.mcp !== null && !Array.isArray(responseJson.meta.mcp)
        ? (responseJson.meta.mcp as Record<string, unknown>)
        : {};
    const hasDeferredMcpActions = Array.isArray(upstreamMcp.deferred_actions) && upstreamMcp.deferred_actions.length > 0;

    if (parsed.data.allow_actions && responseJson.ok && hasDeferredMcpActions) {
      try {
        const ctx = await requireProjectRole(parsed.data.project_id, ["owner", "admin", "operator"]);
        mcpBridge = await materializeNovaMcpActionsFromUpstream({
          project_id: ctx.project_id,
          created_by: ctx.user.id,
          original_message: parsed.data.message,
          trace_id: responseJson.trace_id ?? null,
          upstream_meta: responseJson.meta,
        });
      } catch (error) {
        mcpBridge = { actions: [], rejected: [{ reason: sanitizePublicError(error) }] };
      }
    }

    const safePayload = sanitizeNovaPayload(responseJson, injectedMeta, localActionDraft);
    const currentActions = Array.isArray(safePayload.actions) ? safePayload.actions : [];
    safePayload.actions = [...currentActions, ...mcpBridge.actions];
    const safeMeta = safePayload.meta && typeof safePayload.meta === "object" && !Array.isArray(safePayload.meta)
      ? (safePayload.meta as Record<string, unknown>)
      : {};
    const safeControls = safeMeta.controls && typeof safeMeta.controls === "object" && !Array.isArray(safeMeta.controls)
      ? (safeMeta.controls as Record<string, unknown>)
      : {};
    safeControls.enqueued_actions = safePayload.actions;
    if (mcpBridge.actions.length > 0) safeControls.action_policy = "nova_mcp_actions_waiting_owner_gate";
    safeMeta.controls = safeControls;
    safeMeta.mcp_owner_gate = {
      requested: parsed.data.allow_actions,
      drafts_received: hasDeferredMcpActions,
      materialized: mcpBridge.actions.length,
      rejected: mcpBridge.rejected,
    };
    safePayload.meta = safeMeta;'''
            chat, count = pattern.subn(replacement, chat, count=1)
            if count != 1:
              raise SystemExit('chat response anchor missing')
          chat_path.write_text(chat)

          worker_path = Path('src/lib/agi-action-execution.ts')
          worker = worker_path.read_text()
          import_anchor = 'import { getGitHubRuntimeToken } from "@/lib/github-runtime-executor";'
          import_line = 'import { executeValidatedMcpDraft, validateDeferredMcpDraft } from "@/lib/mcp/mcp-policy";'
          if import_line not in worker:
            worker = worker.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          new_tail = r'''async function executeApprovedMcpQueuePayload(payload: JsonRecord): Promise<JsonRecord> {
  const draft = validateDeferredMcpDraft({
    draft_id: payload.draft_id ?? randomUUID(),
    action_type: "mcp.execute",
    tool_key: "mcp",
    provider: stringValue(payload.provider).toLowerCase(),
    tool: stringValue(payload.tool),
    args: asRecord(payload.args),
    requires_approval: true,
    execution_target: "hocker.one.owner-gate",
  });
  const data = await executeValidatedMcpDraft(draft);
  return {
    operation: "mcp.execute",
    provider: draft.provider,
    tool: draft.tool,
    qualified_name: draft.qualified_name,
    data,
  };
}

export async function executeApprovedAgiAction(params: { project_id: string; action_id: string; actor_id: string }): Promise<AgiActionQueueRow> {
  const pending = await getQueueItem(params.project_id, params.action_id);

  if (pending.status !== "approved") throw new Error(`Acción no aprobada. Estado actual: ${pending.status}`);
  const githubAction = pending.tool_key === "github" && pending.action_type.startsWith("github.");
  const mcpAction = pending.tool_key === "mcp" && pending.action_type === "mcp.execute";
  if (!githubAction && !mcpAction) throw new Error("No existe un worker aprobado para esta acción.");
  if (githubAction) await assertGuidedGithubExecutionOrder(params.project_id, pending);

  const item = await claimApprovedQueueItem({
    project_id: params.project_id,
    action_id: params.action_id,
    actor_id: params.actor_id,
    item: pending,
  });
  const workerName = githubAction
    ? "github_approved_execution_worker_12.7Z-1A"
    : "mcp_approved_execution_worker_1.0";

  try {
    const payload = asRecord(item.payload);
    let result: JsonRecord;

    if (githubAction) {
      const operation = item.action_type.replace(/^github\./, "");
      result =
        operation === "create_branch"
          ? await executeCreateBranch(payload)
          : operation === "upsert_file"
            ? await executeUpsertFile(payload)
            : operation === "create_pr"
              ? await executeCreatePr(payload)
              : (() => { throw new Error(`Operación GitHub no soportada por worker: ${operation}`); })();
    } else {
      result = await executeApprovedMcpQueuePayload(payload);
    }

    const rollbackPlan: JsonRecord = githubAction
      ? buildRollbackPlan(item, result)
      : {
          type: "mcp.provider_specific_manual_review",
          safe: false,
          provider: payload.provider ?? null,
          tool: payload.tool ?? null,
          note: "El rollback depende de la herramienta y requiere revisar la evidencia guardada.",
        };

    return patchQueueItem(item.id, {
      status: "executed",
      executed_by: params.actor_id,
      executed_at: new Date().toISOString(),
      locked_at: null,
      lock_owner: null,
      last_error: null,
      execution_error: null,
      rollback_plan: rollbackPlan,
      execution_result: {
        ok: true,
        executed_at: new Date().toISOString(),
        worker: workerName,
        idempotency_key: item.idempotency_key ?? null,
        attempt_count: item.attempt_count ?? null,
        result,
      },
    });
  } catch (error) {
    const message = error instanceof Error ? error.message : "Falla desconocida al ejecutar acción AGI.";

    await patchQueueItem(item.id, {
      status: "execution_failed",
      executed_by: params.actor_id,
      executed_at: new Date().toISOString(),
      locked_at: null,
      lock_owner: null,
      last_error: message,
      execution_error: message,
      execution_result: {
        ok: false,
        worker: workerName,
        idempotency_key: item.idempotency_key ?? null,
        attempt_count: item.attempt_count ?? null,
      },
    });

    throw error;
  }
}
'''
          worker, count = re.subn(
            r'export async function executeApprovedAgiAction\([\s\S]*\Z',
            new_tail,
            worker,
            count=1,
          )
          if count != 1:
            raise SystemExit('worker tail replacement failed')
          worker_path.write_text(worker)

          ui_path = Path('src/components/hocker-2c/owner/nova/OwnerNovaInlineApprovals.tsx')
          ui = ui_path.read_text()
          ui = ui.replace('function isExecutableGithubAction(action: OwnerLiveAction): boolean {', 'function isExecutableApprovedAction(action: OwnerLiveAction): boolean {', 1)
          ui = ui.replace(
            '  return toolKey === "github" && actionType.startsWith("github.");',
            '  return (toolKey === "github" && actionType.startsWith("github.")) || (toolKey === "mcp" && actionType === "mcp.execute");',
            1,
          )
          ui = ui.replace('const canExecute = isExecutableGithubAction(action);', 'const canExecute = isExecutableApprovedAction(action);', 1)
          if 'toolKey === "mcp" && actionType === "mcp.execute"' not in ui:
            raise SystemExit('approval UI MCP marker missing')
          ui_path.write_text(ui)
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-hocker-mcp-owner-gate-bridge.yml
          git config user.name "hocker-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/nova/chat/route.ts src/lib/agi-action-execution.ts src/components/hocker-2c/owner/nova/OwnerNovaInlineApprovals.tsx .github/workflows/apply-hocker-mcp-owner-gate-bridge.yml
          git commit -m "feat(mcp): complete approval and execution bridge"
          git push origin HEAD:feature/mcp-owner-gate-bridge-20260731
