name: Apply OIDC gateway auth repair

on:
  push:
    branches:
      - fix/oidc-gateway-auth-20260803

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/oidc-gateway-auth-20260803

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply exact runtime and regression-test repair
        run: node scripts/ci/apply-oidc-gateway-auth-repair.mjs

      - name: Commit only runtime and regression tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/serverless-agi-runtime.ts tests/serverless-agi-runtime.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Repair already applied."
            exit 0
          fi
          git commit -m "fix(agi): prefer Vercel OIDC over manual gateway key"
          git push origin HEAD:fix/oidc-gateway-auth-20260803
