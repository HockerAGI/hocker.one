name: Apply Trigger SDK removal

on:
  push:
    branches:
      - fix/full-hardening-20260730
    paths:
      - scripts/remove-trigger-sdk.mjs
      - .github/workflows/apply-trigger-removal.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-hardening-20260730
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/remove-trigger-sdk.mjs
      - name: Commit dispatcher cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/commands/route.ts src/app/api/commands/approve/route.ts
          if git diff --cached --quiet; then
            echo "Trigger SDK already removed"
          else
            git commit -m "fix(commands): rely on signed queue polling for local agents"
            git push origin HEAD:fix/full-hardening-20260730
          fi
