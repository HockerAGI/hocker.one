name: CI

on:
  push:
    branches:
      - main
      - fix/full-hardening-20260730
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify Hocker ONE
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          HOCKER_OWNER_API_KEY: dummy-owner-key

      - name: Production dependency audit
        shell: bash
        run: |
          audit_dir="$(mktemp -d)"
          cp package.json "$audit_dir/package.json"
          cd "$audit_dir"
          npm install --package-lock-only --omit=dev --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
