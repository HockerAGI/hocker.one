name: CI

on:
  push:
    branches:
      - main
      - fix/full-hardening-20260730
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify Hocker ONE
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: audit/chat-approval-ux-20260730
          fetch-depth: 0

      - name: Apply focused approval patch
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          component_path = Path('src/components/hocker-2c/owner/nova/OwnerNovaInlineApprovals.tsx')
          text = component_path.read_text()

          text = text.replace(
            '''  const urls = [
            "/api/agi/runtime/actions?project_id=hocker-one&limit=30",
            "/api/agi/runtime/actions?limit=30",
            "/api/commands",
          ];''',
            '''  const urls = [
            "/api/agi/runtime/actions?project_id=hocker-one&limit=30",
            "/api/agi/runtime/actions?limit=30",
          ];''',
            1,
          )
          text = text.replace(
            '    clean.includes("needs") ||\n    clean.includes("queued")',
            '    clean.includes("needs")',
            1,
          )

          risk_anchor = '''function riskClass(risk: OwnerLiveAction["risk"]) {
            if (risk === "high") return "border-rose-300/30 bg-rose-300/10 text-rose-100";
            if (risk === "medium") return "border-amber-300/30 bg-amber-300/10 text-amber-100";
            return "border-emerald-300/30 bg-emerald-300/10 text-emerald-100";
          }
          '''
          helper = '''
          function isExecutableGithubAction(action: OwnerLiveAction): boolean {
            if (!action.raw || typeof action.raw !== "object" || Array.isArray(action.raw)) return false;
            const raw = action.raw as Record<string, unknown>;
            const toolKey = String(raw.tool_key ?? "").toLowerCase();
            const actionType = String(raw.action_type ?? "").toLowerCase();
            return toolKey === "github" && actionType.startsWith("github.");
          }
          '''
          if 'function isExecutableGithubAction' not in text:
            if risk_anchor not in text:
              raise SystemExit('risk helper anchor not found')
            text = text.replace(risk_anchor, risk_anchor + helper, 1)

          text = text.replace(
            '''  const [message, setMessage] = useState("");

            async function sendDecision(decision: Decision, fallbackNote: string, busyState: Decision | "adjust") {''',
            '''  const [message, setMessage] = useState("");
            const canExecute = isExecutableGithubAction(action);

            async function sendDecision(
              decision: Decision,
              fallbackNote: string,
              busyState: Decision | "adjust",
              executeAfterApproval = false,
            ) {''',
            1,
          )

          old_result = '''      setMessage(
                decision === "approve"
                  ? "Aprobado. La acción quedó autorizada, pero no se ejecutó desde este botón."
                  : "Listo. La acción fue rechazada o enviada a ajuste."
              );

              setNote("");
              onDone();'''
          new_result = '''      if (decision === "approve" && executeAfterApproval) {
                const executionResponse = await fetch("/api/agi/runtime/actions/execute", {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  credentials: "include",
                  body: JSON.stringify({
                    project_id: action.projectId || DEFAULT_PROJECT_ID,
                    action_id: action.id,
                  }),
                });
                const executionPayload = await executionResponse.json().catch(() => ({}));

                if (!executionResponse.ok) {
                  const executionError = executionPayload?.error || executionPayload?.message || "La ejecución no pudo completarse.";
                  setMessage(`La acción quedó aprobada, pero no se ejecutó: ${String(executionError)}`);
                  setNote("");
                  onDone();
                  return;
                }

                setMessage("Aprobada y ejecutada. El resultado quedó guardado en la evidencia.");
              } else {
                setMessage(
                  decision === "approve"
                    ? "Aprobada. Quedó lista para que el ejecutor correspondiente la procese."
                    : "Listo. La acción fue rechazada o enviada a ajuste."
                );
              }

              setNote("");
              onDone();'''
          if old_result in text:
            text = text.replace(old_result, new_result, 1)

          text = text.replace(
            'onClick={() => void sendDecision("approve", "Aprobado desde el chat de NOVA.", "approve")}',
            '''onClick={() => void sendDecision(
                    "approve",
                    "Aprobado desde el chat de NOVA.",
                    "approve",
                    canExecute,
                  )}''',
            1,
          )
          text = text.replace(
            '{busy === "approve" ? "Aprobando..." : "Aprobar"}',
            '''{busy === "approve"
                    ? canExecute ? "Aprobando y ejecutando..." : "Aprobando..."
                    : canExecute ? "Aprobar y ejecutar" : "Aprobar"}''',
            1,
          )

          if '/api/commands' in text or 'clean.includes("queued")' in text:
            raise SystemExit('approval state patch incomplete')
          if 'Aprobar y ejecutar' not in text:
            raise SystemExit('execution UX patch incomplete')
          component_path.write_text(text)

          normalizer_path = Path('src/components/hocker-2c/owner/live/owner-live-normalizers.ts')
          normalizer = normalizer_path.read_text()
          normalizer = normalizer.replace(
            '  if (["pending", "needs_approval", "queued"].includes(clean)) return "Necesita aprobación";\n  if (["approved"].includes(clean)) return "Aprobada";',
            '  if (["pending", "needs_approval"].includes(clean)) return "Necesita aprobación";\n  if (["queued"].includes(clean)) return "En cola";\n  if (["approved"].includes(clean)) return "Aprobada";',
            1,
          )
          normalizer = normalizer.replace('["failed", "error"]', '["failed", "error", "execution_failed"]', 1)
          if 'if (["queued"].includes(clean)) return "En cola";' not in normalizer:
            raise SystemExit('normalizer patch incomplete')
          normalizer_path.write_text(normalizer)
          PY

          rm -f .github/workflows/apply-chat-approval-ux-patch.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "hocker-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/hocker-2c/owner/nova/OwnerNovaInlineApprovals.tsx src/components/hocker-2c/owner/live/owner-live-normalizers.ts .github/workflows/ci.yml .github/workflows/apply-chat-approval-ux-patch.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(chat): make approval states and execution explicit"
            git push origin HEAD:audit/chat-approval-ux-20260730
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          HOCKER_OWNER_API_KEY: dummy-owner-key

      - name: Production dependency audit
        shell: bash
        run: |
          audit_dir="$(mktemp -d)"
          cp package.json "$audit_dir/package.json"
          cd "$audit_dir"
          npm install --package-lock-only --omit=dev --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
