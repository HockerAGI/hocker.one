name: Dependency Lock Refresh

on:
  push:
    branches:
      - hardening/production-readiness-20260807
    paths:
      - package.json
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.repository == 'HockerAGI/hocker.one' && github.ref == 'refs/heads/hardening/production-readiness-20260807'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/production-readiness-20260807
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify high-severity dependency audit
        run: npm audit --audit-level=high

      - name: Verify generated diff scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "package-lock.json"
          git add package-lock.json
          staged="$(git diff --cached --name-only)"
          test "$staged" = "package-lock.json"

      - name: Commit generated lockfile only
        shell: bash
        run: |
          git config user.name "hocker-one-hardening-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh patched dependency lockfile"
          git push origin HEAD:hardening/production-readiness-20260807
