name: Dependency Lock Refresh

on:
  push:
    branches:
      - hardening/production-readiness-20260807
    paths:
      - package.json
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: read

jobs:
  regenerate-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify high-severity dependency audit
        run: npm audit --audit-level=high

      - name: Upload regenerated lockfile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hocker-one-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
