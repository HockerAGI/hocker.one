name: Expand Ecosystem Repository Allowlist

on:
  push:
    branches:
      - fix/ecosystem-repository-owner-gate-20260802
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ecosystem-repository-owner-gate-20260802
      - name: Patch policy and regression
        run: |
          python - <<'PY'
          from pathlib import Path
          policy = Path('src/lib/mcp/mcp-policy.ts')
          text = policy.read_text()
          old = '''const DEFAULT_GITHUB_REPOSITORIES = [
            "HockerAGI/hocker.one",
            "HockerAGI/nova.agi",
            "HockerAGI/hocker-node-agent",
          ] as const;'''
          new = '''const DEFAULT_GITHUB_REPOSITORIES = [
            "HockerAGI/hocker.one",
            "HockerAGI/nova.agi",
            "HockerAGI/hocker-node-agent",
            "HockerAGI/chido.casino",
            "HockerAGI/hocker.agi",
          ] as const;'''
          if old not in text:
              raise SystemExit('policy anchor not found')
          policy.write_text(text.replace(old, new))

          test = Path('tests/mcp-github-owner-policy.test.mjs')
          text = test.read_text()
          text = text.replace(
            'GitHub MCP Owner Gate is limited to the three HOCKER repositories',
            'GitHub MCP Owner Gate covers all five operational HOCKER repositories',
          )
          anchor = '  assert.match(policy, /HockerAGI\\/hocker-node-agent/);\n'
          addition = anchor + '  assert.match(policy, /HockerAGI\\/chido\\.casino/);\n  assert.match(policy, /HockerAGI\\/hocker\\.agi/);\n'
          if anchor not in text:
              raise SystemExit('test anchor not found')
          test.write_text(text.replace(anchor, addition))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/mcp/mcp-policy.ts tests/mcp-github-owner-policy.test.mjs
          git commit -m "fix(owner-gate): allow all ecosystem repositories"
          git push origin HEAD:fix/ecosystem-repository-owner-gate-20260802
