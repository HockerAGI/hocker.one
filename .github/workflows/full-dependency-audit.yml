name: Full dependency audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=optional
      - name: Trace brace-expansion dependency chain
        run: npm ls brace-expansion --all
      - name: Full audit report
        run: npm audit --audit-level=high
