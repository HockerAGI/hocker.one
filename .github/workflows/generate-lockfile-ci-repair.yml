name: Generate lockfile CI repair

on:
  push:
    branches:
      - ci-repair-no-deploy-20260803

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ci-repair-no-deploy-20260803

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --include=optional

      - name: Validate patched dependency tree
        run: npm audit --audit-level=high

      - name: Commit only the regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore(deps): refresh patched lockfile [skip ci]"
          git push origin HEAD:ci-repair-no-deploy-20260803
