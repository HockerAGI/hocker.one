name: One-time command logs policy compatibility fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/command-logs-policy-schema-20260801

      - name: Patch command_logs policy against the actual schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260701_000000_supabase_audit_improvements.sql')
          sql = path.read_text(encoding='utf-8')

          old = '''-- Also add admin read for authenticated project admins
DO $$
BEGIN
  IF NOT EXISTS (
    SELECT 1 FROM pg_policies
    WHERE schemaname = 'public' AND tablename = 'command_logs'
      AND policyname = 'command_logs_select_admin'
  ) THEN
    CREATE POLICY command_logs_select_admin
      ON public.command_logs
      FOR SELECT TO authenticated
      USING (
        project_id IS NOT NULL AND public.is_project_admin(project_id)
      );
  END IF;
END $$;'''

          new = '''-- Add admin read only when command_logs carries an explicit project_id.
-- Legacy production schemas keep this table service-only because project scope
-- cannot be inferred safely from command_id alone.
DO $$
BEGIN
  IF EXISTS (
    SELECT 1
    FROM information_schema.columns
    WHERE table_schema = 'public'
      AND table_name = 'command_logs'
      AND column_name = 'project_id'
  ) AND NOT EXISTS (
    SELECT 1 FROM pg_policies
    WHERE schemaname = 'public' AND tablename = 'command_logs'
      AND policyname = 'command_logs_select_admin'
  ) THEN
    CREATE POLICY command_logs_select_admin
      ON public.command_logs
      FOR SELECT TO authenticated
      USING (
        project_id IS NOT NULL AND public.is_project_admin(project_id)
      );
  END IF;
END $$;'''

          if sql.count(old) != 1:
              raise SystemExit(f'Expected one command_logs admin policy block, found {sql.count(old)}')
          path.write_text(sql.replace(old, new), encoding='utf-8')

          Path('tests/command-logs-policy-schema.test.mjs').write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst migration = () => readFile(new URL("../supabase/migrations/20260701_000000_supabase_audit_improvements.sql", import.meta.url), "utf8");\n\ntest("command_logs admin policy is conditional on project_id", async () => {\n  const sql = await migration();\n  const marker = sql.indexOf("Add admin read only when command_logs carries an explicit project_id");\n  assert.notEqual(marker, -1);\n  const block = sql.slice(marker, sql.indexOf("-- =============================================================", marker));\n  assert.match(block, /information_schema\\.columns/);\n  assert.match(block, /column_name = 'project_id'/);\n  assert.match(block, /command_logs_select_admin/);\n});\n\ntest("legacy command_logs remains service-only when project scope is absent", async () => {\n  const sql = await migration();\n  assert.match(sql, /Legacy production schemas keep this table service-only/);\n  assert.match(sql, /command_logs_service_all/);\n});\n''', encoding='utf-8')
          PY

          rm .github/workflows/one-time-command-logs-policy-fix.yml

      - name: Commit final branch state
        shell: bash
        run: |
          git config user.name "hocker-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260701_000000_supabase_audit_improvements.sql tests/command-logs-policy-schema.test.mjs .github/workflows/one-time-command-logs-policy-fix.yml
          git diff --cached --check
          git commit -m "fix(db): guard command logs admin policy by schema"
          git push origin HEAD:fix/command-logs-policy-schema-20260801
