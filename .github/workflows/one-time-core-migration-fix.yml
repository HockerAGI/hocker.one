name: One-time core migration compatibility fix

on:
  push:
    branches:
      - fix/core-migration-idempotency-20260801
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/core-migration-idempotency-20260801

      - name: Patch legacy migration without destructive DDL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260216_0000_core.sql')
          sql = path.read_text(encoding='utf-8')

          old = '''create or replace function public.is_project_member(pid text)
returns boolean
language sql
stable
as $$
  select exists (
    select 1
    from public.project_members m
    where m.project_id = pid
      and m.user_id = auth.uid()
  );
$$;

create or replace function public.is_project_admin(pid text)
returns boolean
language sql
stable
as $$
  select exists (
    select 1
    from public.project_members m
    where m.project_id = pid
      and m.user_id = auth.uid()
      and m.role in ('owner','admin')
  );
$$;

create or replace function public.is_project_operator(pid text)
returns boolean
language sql
stable
as $$
  select exists (
    select 1
    from public.project_members m
    where m.project_id = pid
      and m.user_id = auth.uid()
      and m.role in ('owner','admin','operator')
  );
$$;'''

          new = '''create or replace function public.is_project_member(p_project_id text)
returns boolean
language sql
stable
set search_path = public, pg_temp
as $$
  select exists (
    select 1
    from public.project_members m
    where m.project_id = p_project_id
      and m.user_id = auth.uid()
  );
$$;

create or replace function public.is_project_admin(p_project_id text)
returns boolean
language sql
stable
set search_path = public, pg_temp
as $$
  select exists (
    select 1
    from public.project_members m
    where m.project_id = p_project_id
      and m.user_id = auth.uid()
      and m.role in ('owner','admin')
  );
$$;

create or replace function public.is_project_operator(p_project_id text)
returns boolean
language sql
stable
set search_path = public, pg_temp
as $$
  select exists (
    select 1
    from public.project_members m
    where m.project_id = p_project_id
      and m.user_id = auth.uid()
      and m.role in ('owner','admin','operator')
  );
$$;'''

          if sql.count(old) != 1:
              raise SystemExit('Expected one helper function block')
          sql = sql.replace(old, new)

          old_constraint = "if not exists (select 1 from pg_constraint where conname = 'commands_status_check') then"
          new_constraint = "if not exists (select 1 from pg_constraint where conname in ('commands_status_check', 'commands_status_ck') and conrelid = 'public.commands'::regclass) then"
          if sql.count(old_constraint) != 1:
              raise SystemExit('Expected one commands status constraint guard')
          sql = sql.replace(old_constraint, new_constraint)

          path.write_text(sql, encoding='utf-8')

          Path('tests/core-migration-idempotency.test.mjs').write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst migration = () => readFile(new URL("../supabase/migrations/20260216_0000_core.sql", import.meta.url), "utf8");\n\ntest("legacy role helpers preserve production parameter names", async () => {\n  const sql = await migration();\n  assert.doesNotMatch(sql, /is_project_(?:member|admin|operator)\\(pid text\\)/);\n  assert.equal((sql.match(/p_project_id text/g) ?? []).length, 3);\n  assert.equal((sql.match(/set search_path = public, pg_temp/g) ?? []).length, 3);\n});\n\ntest("legacy commands migration recognizes the existing status constraint", async () => {\n  const sql = await migration();\n  assert.match(sql, /commands_status_check', 'commands_status_ck/);\n  assert.match(sql, /conrelid = 'public\\.commands'::regclass/);\n});\n''', encoding='utf-8')
          PY

          rm .github/workflows/one-time-core-migration-fix.yml
          rm -f .trigger-core-migration-fix

      - name: Commit final branch state
        shell: bash
        run: |
          git config user.name "hocker-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260216_0000_core.sql tests/core-migration-idempotency.test.mjs .github/workflows/one-time-core-migration-fix.yml .trigger-core-migration-fix
          git diff --cached --check
          git commit -m "fix(db): preserve core helper signatures during replay"
          git push origin HEAD:fix/core-migration-idempotency-20260801
