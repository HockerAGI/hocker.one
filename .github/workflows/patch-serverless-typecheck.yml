name: Patch Serverless Typecheck

on:
  push:
    branches:
      - feat/serverless-nova-worker-20260802
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/serverless-nova-worker-20260802
      - name: Patch PostgREST error handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/serverless-agi-runtime.ts')
          text = path.read_text()
          old = '''    await db().rpc("fail_agi_task", {\n      p_task_id: task.id,\n      p_worker_id: workerId,\n      p_error: message,\n      p_evidence: failureEvidence,\n    }).catch(() => undefined);\n'''
          new = '''    try {\n      await db().rpc("fail_agi_task", {\n        p_task_id: task.id,\n        p_worker_id: workerId,\n        p_error: message,\n        p_evidence: failureEvidence,\n      });\n    } catch {\n      // The original verified failure remains returned even when persistence is unavailable.\n    }\n'''
          if old not in text:
              raise SystemExit('RPC catch anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/serverless-agi-runtime.ts
          git commit -m "fix(agi): await PostgREST failure RPC safely"
          git push origin HEAD:feat/serverless-nova-worker-20260802
