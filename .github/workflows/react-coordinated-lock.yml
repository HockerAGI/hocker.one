name: React Coordinated Lock Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/react-coordinated-lock.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  generate-and-verify:
    name: Generate React 19.2.8 lock evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Set coordinated React versions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies.react = '19.2.8';
          pkg.dependencies['react-dom'] = '19.2.8';
          pkg.devDependencies['@types/react-dom'] = '^19.2.4';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Generate lockfile from registry
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify reproducible install
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Full dependency audit
        run: npm audit

      - name: Upload generated package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: react-19-2-8-package-evidence
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
