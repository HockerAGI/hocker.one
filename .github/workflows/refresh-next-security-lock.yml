name: Refresh Next security lockfile

on:
  push:
    branches:
      - fix/next-16.3.3-security-20260829

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: fix/next-16.3.3-security-20260829

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify reproducible install
        run: npm ci --include=optional

      - name: Reject high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Commit generated lockfile only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): regenerate Next 16.3.3 lockfile"
          git push origin HEAD:fix/next-16.3.3-security-20260829
