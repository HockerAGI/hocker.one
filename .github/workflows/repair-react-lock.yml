name: Repair React lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/multi-d8ec5a502f

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile without scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify coordinated React versions
        run: |
          test "$(node -p "require('./package-lock.json').packages[''].dependencies.react")" = "19.2.8"
          test "$(node -p "require('./package-lock.json').packages['node_modules/react'].version")" = "19.2.8"
          test "$(node -p "require('./package-lock.json').packages['node_modules/react-dom'].version")" = "19.2.8"

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already aligned."
            exit 0
          fi
          git commit -m "chore(deps): regenerate React 19.2.8 lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
