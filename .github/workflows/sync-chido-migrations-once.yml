name: Sync CHIDO migration ledger one-shot

on:
  push:
    branches:
      - ops/supabase-migration-ledger-20260816

permissions:
  contents: write

jobs:
  sync-ledger:
    name: Copy exact CHIDO migration sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Hocker One candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/supabase-migration-ledger-20260816
          fetch-depth: 0

      - name: Checkout pinned CHIDO source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HockerAGI/chido.casino
          ref: 59ea6edb165b553695d246308aa81523a1e7a122
          path: _chido_source
          persist-credentials: false

      - name: Copy exact already-applied migrations to remote timestamps
        shell: bash
        run: |
          set -euo pipefail
          src="_chido_source/supabase/migrations"
          dst="supabase/migrations"

          cp "$src/20260806170000_chido_payment_provider_hardening_20260806.sql" "$dst/20260810182408_chido_payment_provider_hardening_20260806.sql"
          cp "$src/20260806185000_chido_prelaunch_games_fail_closed_20260810.sql" "$dst/20260810182511_chido_prelaunch_games_fail_closed_20260810.sql"
          cp "$src/20260806173000_chido_game_settlement_fail_closed_20260806.sql" "$dst/20260810184103_chido_game_settlement_fail_closed_20260806.sql"
          cp "$src/20260806173500_kyc_status_constraint_20260806.sql" "$dst/20260810184116_kyc_status_constraint_20260806.sql"
          cp "$src/20260806174000_game_row_constraints_20260806.sql" "$dst/20260810184134_game_row_constraints_20260806.sql"
          cp "$src/20260806180000_compliance_kyc_rate_hardening_20260806.sql" "$dst/20260810184240_compliance_kyc_rate_hardening_20260806.sql"
          cp "$src/20260806181000_game_fairness_access_hardening_20260806.sql" "$dst/20260810184321_game_fairness_access_hardening_20260806.sql"
          cp "$src/20260806182000_private_game_history_rpc_20260806.sql" "$dst/20260810184341_private_game_history_rpc_20260806.sql"
          cp "$src/20260806183000_atomic_admin_financial_audit_20260806.sql" "$dst/20260810184413_atomic_admin_financial_audit_20260806.sql"
          cp "$src/20260806184000_authenticated_login_rate_reset_20260806.sql" "$dst/20260810184437_authenticated_login_rate_reset_20260806.sql"
          cp "$src/20260806185500_chido_game_control_scope_hardening_20260810.sql" "$dst/20260810184459_chido_game_control_scope_hardening_20260810.sql"
          cp "$src/20260806190000_chido_private_helper_privilege_hardening_20260810.sql" "$dst/20260810190312_chido_private_helper_privilege_hardening_20260810.sql"
          cp "$src/20260811025000_promo_offer_public_visibility_hardening.sql" "$dst/20260811100821_promo_offer_public_visibility_hardening_20260811.sql"

          cmp "$src/20260806170000_chido_payment_provider_hardening_20260806.sql" "$dst/20260810182408_chido_payment_provider_hardening_20260806.sql"
          cmp "$src/20260806185000_chido_prelaunch_games_fail_closed_20260810.sql" "$dst/20260810182511_chido_prelaunch_games_fail_closed_20260810.sql"
          cmp "$src/20260806173000_chido_game_settlement_fail_closed_20260806.sql" "$dst/20260810184103_chido_game_settlement_fail_closed_20260806.sql"
          cmp "$src/20260806173500_kyc_status_constraint_20260806.sql" "$dst/20260810184116_kyc_status_constraint_20260806.sql"
          cmp "$src/20260806174000_game_row_constraints_20260806.sql" "$dst/20260810184134_game_row_constraints_20260806.sql"
          cmp "$src/20260806180000_compliance_kyc_rate_hardening_20260806.sql" "$dst/20260810184240_compliance_kyc_rate_hardening_20260806.sql"
          cmp "$src/20260806181000_game_fairness_access_hardening_20260806.sql" "$dst/20260810184321_game_fairness_access_hardening_20260806.sql"
          cmp "$src/20260806182000_private_game_history_rpc_20260806.sql" "$dst/20260810184341_private_game_history_rpc_20260806.sql"
          cmp "$src/20260806183000_atomic_admin_financial_audit_20260806.sql" "$dst/20260810184413_atomic_admin_financial_audit_20260806.sql"
          cmp "$src/20260806184000_authenticated_login_rate_reset_20260806.sql" "$dst/20260810184437_authenticated_login_rate_reset_20260806.sql"
          cmp "$src/20260806185500_chido_game_control_scope_hardening_20260810.sql" "$dst/20260810184459_chido_game_control_scope_hardening_20260810.sql"
          cmp "$src/20260806190000_chido_private_helper_privilege_hardening_20260810.sql" "$dst/20260810190312_chido_private_helper_privilege_hardening_20260810.sql"
          cmp "$src/20260811025000_promo_offer_public_visibility_hardening.sql" "$dst/20260811100821_promo_offer_public_visibility_hardening_20260811.sql"

      - name: Commit ledger-only synchronization and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hocker AGI Automation"
          git config user.email "contacto.hocker@gmail.com"
          git add supabase/migrations
          git rm .github/workflows/sync-chido-migrations-once.yml
          git diff --cached --check
          git commit -m "fix(db): import exact shared CHIDO migration history"
          git push origin HEAD:ops/supabase-migration-ledger-20260816
