<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Sin conexión | Hocker ONE</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #f8fafc; padding: 24px; }
      main { width: min(560px, 100%); border: 1px solid rgba(255,255,255,.1); border-radius: 28px; padding: 32px; background: rgba(15,23,42,.72); }
      p { color: #cbd5e1; line-height: 1.65; }
      .eyebrow { color: #67e8f9; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(28px, 7vw, 44px); line-height: 1.05; }
      button { min-height: 48px; margin-top: 12px; border: 0; border-radius: 999px; padding: 0 20px; background: #67e8f9; color: #082f49; font-weight: 800; cursor: pointer; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Hocker ONE</div>
      <h1>Sin conexión</h1>
      <p>La consola necesita conexión para consultar el estado operativo. Esta pantalla no conserva información de tu cuenta ni del proyecto.</p>
      <button type="button" onclick="location.reload()">Reintentar conexión</button>
    </main>
  </body>
</html>
